name: Setup Node.js
description: Install Node.js 22 for workflow jobs.

inputs:
  node-version:
    description: Node.js major version to install.
    required: false
    default: '22'

runs:
  using: composite
  steps:
    - name: Install Node.js
      shell: bash
      env:
        NODE_VERSION: ${{ inputs.node-version }}
      run: |
        set -euo pipefail

        if command -v node >/dev/null 2>&1; then
          current_major="$(node -p "process.version.slice(1).split('.')[0]")"
          if [ "$current_major" = "$NODE_VERSION" ]; then
            node --version
            npm --version
            exit 0
          fi
        fi

        curl -fsSL "https://deb.nodesource.com/setup_${NODE_VERSION}.x" | sudo -E bash -
        sudo apt-get install -y nodejs
        node --version
        npm --version
