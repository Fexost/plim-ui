name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Weekly dependency audit on Monday mornings (UTC).
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit-workspace:
    name: Audit (workspace)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        env:
          REPOSITORY: ${{ github.repository }}
          TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          SHA: ${{ github.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            ref="$PR_HEAD_SHA"
          else
            ref="$SHA"
          fi
          git init
          git remote add origin "https://x-access-token:${TOKEN}@github.com/${REPOSITORY}.git"
          git fetch --depth=1 origin "$ref"
          git checkout --force "$ref"

      - name: Setup Node.js
        uses: ./.github/actions/setup-node

      - name: Install dependencies
        run: npm ci

      - name: Audit workspace production dependencies
        run: npm audit --omit=dev --audit-level=high

  audit-ui:
    name: Audit (ui)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        env:
          REPOSITORY: ${{ github.repository }}
          TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          SHA: ${{ github.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            ref="$PR_HEAD_SHA"
          else
            ref="$SHA"
          fi
          git init
          git remote add origin "https://x-access-token:${TOKEN}@github.com/${REPOSITORY}.git"
          git fetch --depth=1 origin "$ref"
          git checkout --force "$ref"

      - name: Setup Node.js
        uses: ./.github/actions/setup-node

      - name: Install dependencies
        run: npm ci

      - name: Build library
        run: npm run build:ui

      - name: Prepare published package lockfile
        working-directory: dist/plim-ui
        run: npm install --package-lock-only --omit=peer

      - name: Audit published ui package
        working-directory: dist/plim-ui
        run: npm audit --omit=peer --audit-level=high

  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout repository
        env:
          REPOSITORY: ${{ github.repository }}
          TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          SHA: ${{ github.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            ref="$PR_HEAD_SHA"
          else
            ref="$SHA"
          fi
          git init
          git remote add origin "https://x-access-token:${TOKEN}@github.com/${REPOSITORY}.git"
          git fetch --depth=1 origin "$ref"
          git checkout --force "$ref"

      - name: Setup Node.js
        uses: ./.github/actions/setup-node

      - name: Install dependencies
        run: npm ci

      - name: Review dependency changes
        uses: ./.github/actions/dependency-review
