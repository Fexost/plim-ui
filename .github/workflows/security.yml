name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Weekly dependency audit on Monday mornings (UTC).
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit-workspace:
    name: Audit (workspace)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: ./.github/actions/checkout-repo

      - name: Setup Node.js
        uses: ./.github/actions/setup-node

      - name: Install dependencies
        run: npm ci

      - name: Audit workspace production dependencies
        run: npm audit --omit=dev --audit-level=high

  audit-ui:
    name: Audit (ui)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: ./.github/actions/checkout-repo

      - name: Setup Node.js
        uses: ./.github/actions/setup-node

      - name: Install dependencies
        run: npm ci

      - name: Build library
        run: npm run build:ui

      - name: Prepare published package lockfile
        working-directory: dist/plim-ui
        run: npm install --package-lock-only --omit=peer

      - name: Audit published ui package
        working-directory: dist/plim-ui
        run: npm audit --omit=peer --audit-level=high

  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: ./.github/actions/checkout-repo

      - name: Setup Node.js
        uses: ./.github/actions/setup-node

      - name: Install dependencies
        run: npm ci

      - name: Review dependency changes
        uses: ./.github/actions/dependency-review
