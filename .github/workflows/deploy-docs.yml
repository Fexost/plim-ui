name: Deploy docs to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy (docs)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        env:
          REPOSITORY: ${{ github.repository }}
          TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          SHA: ${{ github.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            ref="$PR_HEAD_SHA"
          else
            ref="$SHA"
          fi
          git init
          git remote add origin "https://x-access-token:${TOKEN}@github.com/${REPOSITORY}.git"
          git fetch --depth=1 origin "$ref"
          git checkout --force "$ref"

      - name: Setup Node.js
        uses: ./.github/actions/setup-node

      - name: Install dependencies
        run: npm ci

      - name: Build library and docs
        run: npm run build:production

      - name: Configure SPA fallback
        run: cp dist/docs/browser/index.html dist/docs/browser/404.html

      - name: Deploy to GitHub Pages
        uses: ./.github/actions/deploy-github-pages
        with:
          path: dist/docs/browser
