name: Deploy docs to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy (docs)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: ./.github/actions/checkout-repo

      - name: Setup Node.js
        uses: ./.github/actions/setup-node

      - name: Install dependencies
        run: npm ci

      - name: Build library and docs
        run: npm run build:production

      - name: Configure SPA fallback
        run: cp dist/docs/browser/index.html dist/docs/browser/404.html

      - name: Deploy to GitHub Pages
        uses: ./.github/actions/deploy-github-pages
        with:
          path: dist/docs/browser
