name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-ui:
    name: Lint (ui)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        env:
          REPOSITORY: ${{ github.repository }}
          TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          SHA: ${{ github.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            ref="$PR_HEAD_SHA"
          else
            ref="$SHA"
          fi
          git init
          git remote add origin "https://x-access-token:${TOKEN}@github.com/${REPOSITORY}.git"
          git fetch --depth=1 origin "$ref"
          git checkout --force "$ref"

      - name: Setup Node.js
        uses: ./.github/actions/setup-node

      - name: Install dependencies
        run: npm ci

      - name: Lint ui
        run: npx ng lint ui

  lint-docs:
    name: Lint (docs)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        env:
          REPOSITORY: ${{ github.repository }}
          TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          SHA: ${{ github.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            ref="$PR_HEAD_SHA"
          else
            ref="$SHA"
          fi
          git init
          git remote add origin "https://x-access-token:${TOKEN}@github.com/${REPOSITORY}.git"
          git fetch --depth=1 origin "$ref"
          git checkout --force "$ref"

      - name: Setup Node.js
        uses: ./.github/actions/setup-node

      - name: Install dependencies
        run: npm ci

      - name: Lint docs
        run: npx ng lint docs

  test-ui:
    name: Test (ui)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        env:
          REPOSITORY: ${{ github.repository }}
          TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          SHA: ${{ github.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            ref="$PR_HEAD_SHA"
          else
            ref="$SHA"
          fi
          git init
          git remote add origin "https://x-access-token:${TOKEN}@github.com/${REPOSITORY}.git"
          git fetch --depth=1 origin "$ref"
          git checkout --force "$ref"

      - name: Setup Node.js
        uses: ./.github/actions/setup-node

      - name: Install dependencies
        run: npm ci

      - name: Test ui
        run: npm run test:ui

  test-docs:
    name: Test (docs)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        env:
          REPOSITORY: ${{ github.repository }}
          TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          SHA: ${{ github.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            ref="$PR_HEAD_SHA"
          else
            ref="$SHA"
          fi
          git init
          git remote add origin "https://x-access-token:${TOKEN}@github.com/${REPOSITORY}.git"
          git fetch --depth=1 origin "$ref"
          git checkout --force "$ref"

      - name: Setup Node.js
        uses: ./.github/actions/setup-node

      - name: Install dependencies
        run: npm ci

      - name: Build library
        run: npm run build:ui

      - name: Test docs
        run: npm run test:docs
