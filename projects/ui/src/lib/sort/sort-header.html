<button type="button" class="plim-sort-header__button" (click)="toggle()">
	<span class="plim-sort-header__label"><ng-content /></span>
	<span class="plim-sort-header__indicator" aria-hidden="true">
		@if (direction() !== 'desc') {
			<span class="plim-sort-header__arrow plim-sort-header__arrow--up"></span>
		}
		@if (direction() !== 'asc') {
			<span class="plim-sort-header__arrow plim-sort-header__arrow--down"></span>
		}
	</span>
</button>
