<div class="plim-form-field__label">
	<ng-content select="[plimFormFieldLabel]" />
</div>

<div class="plim-form-field__control">
	<ng-content />
</div>

<div class="plim-form-field__hint">
	<ng-content select="[plimFormFieldHint]" />
</div>

<div class="plim-form-field__error" [attr.role]="invalid() ? 'alert' : null">
	<ng-content select="[plimFormFieldError]" />
</div>
