<plim-header sticky>
	<div plimHeaderStart class="docs-header-start">
		@if (nav.isMobile()) {
			<button
				type="button"
				plimButton
				variant="secondary"
				class="docs-header-control"
				(click)="nav.toggleNav()"
				[attr.aria-expanded]="nav.navOpen()"
				aria-controls="docs-sidebar"
			>
				Menu
			</button>
		}
		<a [routerLink]="'/' + DOCS_HOME" class="docs-brand">
			<img src="brand/mark.svg" alt="" class="docs-brand-mark" width="28" height="28" />
			<span class="docs-brand-text">
				<span class="docs-brand-name">plim</span><span class="docs-brand-ui">ui</span>
			</span>
		</a>
	</div>

	<div plimHeaderEnd class="docs-header-end">
		<nav class="docs-header-actions" aria-label="Header actions">
			<div class="docs-header-actions__primary">
				<button
					type="button"
					plimButton
					variant="secondary"
					class="docs-header-control"
					(click)="theme.toggle()"
				>
					{{ theme.theme() === 'dark' ? 'Light theme' : 'Dark theme' }}
				</button>
			</div>
			<div class="docs-header-actions__links">
				<button
					type="button"
					plimButton
					variant="text"
					(click)="openExternal('https://www.npmjs.com/package/plim-ui')"
				>
					Npm
				</button>
				<button
					type="button"
					plimButton
					variant="text"
					(click)="openExternal('https://github.com/Fexost/plim-ui')"
				>
					GitHub
				</button>
			</div>
		</nav>
	</div>
</plim-header>

<div class="docs-shell docs-shell--sidebar-push">
	@if (nav.isMobile() && nav.navOpen()) {
		<button
			type="button"
			class="docs-nav-backdrop"
			aria-label="Close navigation menu"
			(click)="nav.closeNav()"
		></button>
	}

	<plim-sidebar
		id="docs-sidebar"
		[open]="nav.navOpen()"
		[mode]="nav.sidebarMode()"
		aria-label="Documentation navigation"
	>
		<app-docs-search plimSidebarHeader />
		<app-docs-nav plimSidebarNav />
		<div plimSidebarFooter class="docs-sidebar-footer">
			<plim-separator />
			<plim-badge variant="success" class="docs-sidebar-badge">WCAG-minded</plim-badge>
		</div>
	</plim-sidebar>

	<main id="main-content" class="docs-main">
		<router-outlet />
	</main>
</div>
