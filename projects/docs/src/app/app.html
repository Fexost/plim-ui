<plim-header sticky>
	<div plimHeaderStart class="docs-header-start">
		@if (isMobile()) {
			<button
				type="button"
				plimButton
				variant="secondary"
				class="docs-nav-toggle"
				(click)="toggleNav()"
				[attr.aria-expanded]="navOpen()"
				aria-controls="docs-sidebar"
				aria-label="Toggle documentation navigation"
			>
				Menu
			</button>
		}
		<a [routerLink]="'/' + DOCS_HOME" class="docs-brand">
			<img src="brand/mark.svg" alt="" class="docs-brand-mark" width="28" height="28" />
			<span class="docs-brand-text">
				<span class="docs-brand-name">plim</span><span class="docs-brand-ui">ui</span>
			</span>
		</a>
	</div>

	<div plimHeaderEnd>
		<nav class="docs-header-nav" aria-label="Header actions">
			<button
				type="button"
				plimButton
				variant="secondary"
				class="docs-theme-toggle"
				(click)="theme.toggle()"
				[attr.aria-label]="theme.theme() === 'dark' ? 'Switch to light theme' : 'Switch to dark theme'"
			>
				{{ theme.theme() === 'dark' ? 'Light' : 'Dark' }}
			</button>
			<a
				href="https://github.com/Fexost/plim-ui"
				target="_blank"
				rel="noopener noreferrer"
				class="docs-header-link"
			>
				GitHub
			</a>
		</nav>
	</div>
</plim-header>

<div class="docs-shell docs-shell--sidebar-push">
	@if (isMobile() && navOpen()) {
		<button
			type="button"
			class="docs-nav-backdrop"
			aria-label="Close navigation menu"
			(click)="closeNav()"
		></button>
	}

	<plim-sidebar
		id="docs-sidebar"
		[open]="navOpen()"
		[mode]="sidebarMode()"
		aria-label="Documentation navigation"
	>
		<app-docs-nav plimSidebarNav />
		<div plimSidebarFooter>
			<plim-card class="docs-sidebar-card">
				<div class="docs-sidebar-card__inner">
					<plim-badge variant="success" aria-hidden="true">✓</plim-badge>
					<div>
						<strong>WCAG-minded</strong>
						<p>Built with keyboard support and visible focus states.</p>
					</div>
				</div>
			</plim-card>
		</div>
	</plim-sidebar>

	<main class="docs-main">
		<router-outlet />
	</main>
</div>
