@if (isOpen) {
	<div class="docs-command-palette">
		<button
			type="button"
			class="docs-command-palette__backdrop"
			aria-label="Close search"
			(click)="onBackdropClick()"
		></button>

		<div
			class="docs-command-palette__dialog"
			role="dialog"
			aria-modal="true"
			aria-label="Search documentation"
			tabindex="-1"
			(keydown)="onKeydown($event)"
		>
			<label class="docs-command-palette__label" for="docs-command-palette-input">
				Search documentation
			</label>
			<input
				#paletteInput
				id="docs-command-palette-input"
				class="docs-command-palette__input"
				type="search"
				plimInput
				placeholder="Search pages…"
				role="combobox"
				aria-autocomplete="list"
				aria-controls="docs-command-palette-results"
				aria-expanded="true"
				[value]="palette.query()"
				(input)="onInput($event)"
			/>

			<ul id="docs-command-palette-results" class="docs-command-palette__results" role="listbox">
				@for (result of results(); track result.path; let index = $index) {
					<li role="presentation">
						<button
							type="button"
							class="docs-command-palette__result"
							role="option"
							[attr.aria-selected]="isResultActive(index)"
							[class.is-active]="isResultActive(index)"
							(click)="navigateToResult(result)"
							(mouseenter)="activeIndex = index"
						>
							<span class="docs-command-palette__result-label">{{ result.label }}</span>
							<span class="docs-command-palette__result-section">{{ result.sectionLabel }}</span>
						</button>
					</li>
				} @empty {
					<li class="docs-command-palette__empty" role="status">No pages match your search.</li>
				}
			</ul>

			<p class="docs-command-palette__hint">
				<kbd>↑</kbd><kbd>↓</kbd> navigate <kbd>Enter</kbd> open <kbd>Esc</kbd> close
			</p>
		</div>
	</div>
}
