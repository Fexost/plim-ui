<div class="docs-table-wrap">
	<table plimTable class="docs-table">
		<thead>
			<tr>
				<th scope="col">Token</th>
				<th scope="col">Usage</th>
			</tr>
		</thead>
		<tbody>
			@for (entry of tokens(); track entry.token) {
				<tr>
					<td><code>{{ entry.token }}</code></td>
					<td>{{ entry.usage }}</td>
				</tr>
			}
		</tbody>
	</table>
</div>
