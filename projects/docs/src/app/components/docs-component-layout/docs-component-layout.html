<article class="docs-component">
	<header class="docs-component__intro">
		<p class="docs-breadcrumbs">
			<span>{{ category() }}</span>
			<span> / {{ title() }}</span>
		</p>

		<h1>{{ title() }}</h1>

		<div class="docs-lead">
			<ng-content select="[docsLead]" />
		</div>
	</header>

	<nav class="docs-component__jump-nav" aria-label="Page sections">
		@for (section of jumpSections; track section.id) {
			<a [routerLink]="'.'" [fragment]="section.id">{{ section.label }}</a>
		}
	</nav>

	<plim-separator />

	<ng-content />
</article>
