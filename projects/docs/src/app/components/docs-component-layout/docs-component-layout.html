<article class="docs-component">
	<header class="docs-component__intro">
		<p class="docs-component__breadcrumbs">
			<a [routerLink]="home">Components</a>
			<span> / {{ title() }}</span>
		</p>

		<p class="docs-eyebrow">{{ category() }}</p>
		<h1>{{ title() }}</h1>

		<div class="docs-lead">
			<ng-content select="[docsLead]" />
		</div>
	</header>

	<nav class="docs-component__jump-nav" aria-label="Page sections">
		@for (section of sections; track section.id) {
			<a [routerLink]="'.'" [fragment]="section.id">{{ section.label }}</a>
		}
	</nav>

	<ng-content />
</article>
