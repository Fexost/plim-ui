<article class="docs-component">
	<header class="docs-component__intro">
		<p class="docs-breadcrumbs">
			<span>{{ category() }}</span>
			<span> / {{ title() }}</span>
		</p>

		<h1>{{ title() }}</h1>

		<div class="docs-lead">
			<ng-content select="[docsLead]" />
		</div>

		@if (nativeElement()) {
			<aside class="docs-native-note" role="note">
				<span class="docs-native-note__label">Native HTML</span>
				<p class="docs-native-note__text">
					Built on <code>{{ nativeElement() }}</code> — semantics and form compatibility stay
					on the element.
				</p>
			</aside>
		}
	</header>

	<nav class="docs-component__jump-nav" aria-label="Page sections">
		@for (section of jumpSections; track section.id) {
			<a [routerLink]="'.'" [fragment]="section.id">{{ section.label }}</a>
		}
	</nav>

	<plim-separator />

	<ng-content />
</article>
