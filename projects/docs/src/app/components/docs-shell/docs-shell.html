<div class="docs-shell docs-shell--sidebar-push">
	@if (nav.isMobile() && nav.navOpen()) {
		<button
			type="button"
			class="docs-shell__backdrop"
			aria-label="Close navigation menu"
			(click)="nav.closeNav()"
		></button>
	}

	<plim-sidebar
		id="docs-sidebar"
		[open]="nav.navOpen()"
		[mode]="nav.sidebarMode()"
		aria-label="Documentation navigation"
	>
		<app-docs-nav plimSidebarNav />
	</plim-sidebar>

	<main id="main-content" class="docs-shell__main">
		<router-outlet />
	</main>
</div>
