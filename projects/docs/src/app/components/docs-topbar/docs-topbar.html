<div class="docs-topbar">
	<plim-header>
		<div plimHeaderStart class="docs-topbar__start">
			@if (nav.isMobile()) {
				<button
					type="button"
					plimButton
					variant="secondary"
					class="docs-topbar__menu"
					(click)="nav.toggleNav()"
					[attr.aria-expanded]="nav.navOpen()"
					[attr.aria-label]="nav.navOpen() ? 'Close navigation menu' : 'Open navigation menu'"
					aria-controls="docs-sidebar"
				>
					<span
						class="docs-topbar__menu-icon"
						[class.docs-topbar__menu-icon--open]="nav.navOpen()"
						aria-hidden="true"
					></span>
				</button>
			}

			<a [routerLink]="'/' + DOCS_HOME" class="docs-topbar__brand" aria-label="plim-ui home">
				<img src="brand/mark.svg" alt="" class="docs-topbar__brand-mark" width="28" height="28" />
				@if (!nav.isMobile()) {
					<span class="docs-topbar__brand-text">
						<span class="docs-topbar__brand-name">plim</span>
						<span class="docs-topbar__brand-ui">ui</span>
					</span>
				}
			</a>
		</div>

		<div plimHeaderEnd class="docs-topbar__end">
			<nav class="docs-topbar__actions" aria-label="Header actions">
				<button
					type="button"
					plimButton
					variant="secondary"
					class="docs-topbar__search"
					[class.docs-topbar__search--icon-only]="nav.isMobile()"
					(click)="commandPalette.toggle()"
					[attr.aria-label]="nav.isMobile() ? 'Search documentation' : null"
				>
					<span class="material-symbols-outlined docs-topbar__search-icon" aria-hidden="true">
						search
					</span>
					@if (!nav.isMobile()) {
						<span class="docs-topbar__search-label">Search</span>
						<kbd class="plim-kbd docs-topbar__search-kbd" aria-hidden="true">
							{{ modifierKeyLabel }} K
						</kbd>
					}
				</button>
				@if (!nav.isMobile()) {
					<div class="docs-topbar__links">
						<ng-container *ngTemplateOutlet="externalLinkButtons" />
					</div>
				}
				<button
					type="button"
					plimButton
					variant="secondary"
					class="docs-topbar__theme-toggle"
					(click)="theme.toggle()"
					[attr.aria-label]="theme.theme() === 'dark' ? 'Switch to light theme' : 'Switch to dark theme'"
				>
					<span class="material-symbols-outlined docs-topbar__theme-icon" aria-hidden="true">
						{{ theme.theme() === 'dark' ? 'light_mode' : 'dark_mode' }}
					</span>
				</button>
			</nav>
		</div>
	</plim-header>
</div>

<ng-template #externalLinkButtons>
	@for (link of externalLinks; track link.href) {
		<button type="button" plimButton variant="text" (click)="openExternal(link.href)">
			{{ link.label }}
		</button>
	}
</ng-template>
