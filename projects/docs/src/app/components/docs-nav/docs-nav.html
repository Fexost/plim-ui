<nav class="docs-nav">
	@for (section of sections; track section.label) {
		<div>
			<h3 class="docs-nav-label">{{ section.label }}</h3>
			<ul>
				@for (item of section.items; track item.label) {
					<li>
						@if (item.path) {
							<a [routerLink]="'/' + item.path" routerLinkActive="is-active">{{ item.label }}</a>
						} @else {
							<span class="docs-nav-item docs-nav-item--soon">{{ item.label }}</span>
						}
					</li>
				}
			</ul>
		</div>
	}
</nav>
