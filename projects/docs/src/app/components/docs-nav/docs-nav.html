<nav class="docs-nav">
	@if (nav.isMobile()) {
		<div class="docs-nav__external-links" aria-label="External links">
			@for (link of externalLinks; track link.href) {
				<button type="button" plimButton variant="text" (click)="openExternal(link.href)">
					{{ link.label }}
				</button>
			}
		</div>
	}
	@for (section of sections; track section.label) {
		<div class="docs-nav__section">
			<p class="docs-nav-label">{{ section.label }}</p>
			<ul>
				@for (item of section.items; track item.label) {
					<li>
						@if (item.path) {
							<a [routerLink]="'/' + item.path" routerLinkActive="is-active">{{ item.label }}</a>
						} @else {
							<span class="docs-nav-item docs-nav-item--soon">{{ item.label }}</span>
						}
					</li>
				}
			</ul>
		</div>
	}
</nav>
